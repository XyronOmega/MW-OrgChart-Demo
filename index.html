<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anonymisierte, interaktive Live-Demo eines konfigurierbaren Organigramm-Systems">
  <meta name="color-scheme" content="light">
  <title>MW OrgChart – Live-Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070042'/%3E%3Cpath d='M15 18h14v11H15zm20 0h14v11H35zM25 35h14v11H25z' fill='%2399e7ff'/%3E%3Cpath d='M22 29v4h20v-4M32 33v2' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="leadership-overlay.css?v=2">
  <link rel="stylesheet" href="organization-unit-editor.css?v=2">
  <link rel="stylesheet" href="platform-admin.css?v=1">
  <link rel="stylesheet" href="changeset-demo.css?v=1">
  <link rel="stylesheet" href="orgchart-navigation.css?v=1">
  <link rel="stylesheet" href="person-groups.css?v=1">
  <link rel="stylesheet" href="navigation-shell.css?v=1">
</head>
<body>
  <div class="demo-strip"><strong>Öffentliche Demo</strong><span>Nur erfundene Beispieldaten · Änderungen bleiben lokal in diesem Browser</span></div>
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <div class="colorbar"><span></span><span></span><span></span><span></span></div>
      <div class="login-inner">
        <span class="eyebrow">Münchner Wohnen · Demo</span>
        <h1>MW OrgChart</h1>
        <p>Interaktive Vorschau des Organigramms mit Rollen, Profilen und Verwaltungsansichten.</p>
        <label class="field"><span>Demo-Rolle auswählen</span><select id="roleSelect"></select></label>
        <div id="roleInfo" class="role-info"></div>
        <button id="loginBtn" class="btn btn-primary wide">Demo starten</button>
      </div>
    </div>
  </section>
  <section id="app" class="app hidden">
    <header class="header">
      <div><span class="eyebrow header-eyebrow">Münchner Wohnen</span><h1>MW OrgChart</h1><p>Interaktives Organigramm · öffentliche Demo</p></div>
      <div class="header-actions"><div class="user-chip"><strong id="userName"></strong><span id="userRole"></span></div><button id="switchRoleBtn" class="btn btn-ghost btn-small">Rolle wechseln</button><button id="resetBtn" class="btn btn-ghost btn-small">Demo zurücksetzen</button></div>
    </header>
    <nav id="nav" class="nav" aria-label="Hauptnavigation"></nav>
    <main id="content" class="content"></main>
  </section>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-label="Personenprofil"></aside>
  <script src="app.js?v=stable-2"></script>
  <script src="leadership-overlay.js?v=2"></script>
  <script src="platform-admin.js?v=1"></script>
  <script src="organization-unit-editor.js?v=2"></script>
  <script src="changeset-demo.js?v=1"></script>
  <script src="orgchart-navigation-bootstrap.js?v=2"></script>
  <script src="orgchart-navigation.js?v=1"></script>
  <script src="person-groups.js?v=1"></script>
  <script src="navigation-shell.js?v=1"></script>
</body>
</html>
