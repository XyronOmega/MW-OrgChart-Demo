<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Anonymisierte Live-Demo des MW OrgChart" />
  <meta name="color-scheme" content="light" />
  <title>MW OrgChart – Live-Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23070042'/%3E%3Cpath d='M15 18h14v11H15zm20 0h14v11H35zM25 35h14v11H25z' fill='%2399e7ff'/%3E%3Cpath d='M22 29v4h20v-4M32 33v2' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  <style>
    :root {
      --mw-dark: #070042;
      --mw-blue: #99e7ff;
      --mw-green: #a8ffab;
      --mw-pink: #fda8ff;
      --mw-red: #ff757b;
      --ink: #1c1b2c;
      --muted: #66647a;
      --line: #d9d8e2;
      --surface: #ffffff;
      --canvas: #f5f5f8;
      --focus: #4d45d6;
      --shadow: 0 12px 36px rgba(7, 0, 66, .10);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--canvas); }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--canvas); font-family: Hellix, "Segoe UI", Arial, sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid rgba(77,69,214,.35); outline-offset: 2px; }
    .hidden { display: none !important; }

    .demo-strip {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 18px;
      color: #fff;
      background: var(--mw-dark);
      font-size: 13px;
      letter-spacing: .01em;
    }
    .demo-strip strong { color: var(--mw-green); }

    .login-page {
      min-height: calc(100vh - 34px);
      display: grid;
      place-items: center;
      padding: 36px 18px;
      background:
        radial-gradient(circle at 12% 18%, rgba(153,231,255,.55), transparent 32%),
        radial-gradient(circle at 88% 78%, rgba(253,168,255,.42), transparent 34%),
        linear-gradient(140deg, #f9f9fb 0%, #eeeeF5 100%);
    }
    .login-card {
      width: min(540px, 100%);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .login-accent { display: grid; grid-template-columns: repeat(4, 1fr); height: 9px; }
    .login-accent span:nth-child(1){ background: var(--mw-red); }
    .login-accent span:nth-child(2){ background: var(--mw-green); }
    .login-accent span:nth-child(3){ background: var(--mw-pink); }
    .login-accent span:nth-child(4){ background: var(--mw-blue); }
    .login-content { padding: 36px; }
    .eyebrow { display: inline-flex; margin-bottom: 8px; color: var(--mw-dark); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .login-brand h1 { margin-bottom: 10px; color: var(--mw-dark); font-size: clamp(30px, 6vw, 44px); line-height: 1; }
    .login-brand p { margin-bottom: 28px; color: var(--muted); line-height: 1.55; }
    .form-field { display: grid; gap: 8px; margin-bottom: 16px; }
    .form-field > span { font-size: 14px; font-weight: 700; }
    select, input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #c7c6d1;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
    }
    .login-summary {
      display: grid;
      gap: 4px;
      margin: 18px 0;
      padding: 16px;
      border-left: 6px solid var(--mw-blue);
      background: #f4fbfd;
      color: var(--muted);
      font-size: 14px;
    }
    .login-summary strong { color: var(--mw-dark); font-size: 16px; }
    .primary-button, .secondary-button, .ghost-button, .danger-button {
      min-height: 42px;
      border: 1px solid transparent;
      padding: 10px 16px;
      font-weight: 750;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .primary-button { color: #fff; background: var(--mw-dark); }
    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(7,0,66,.18); }
    .secondary-button { color: var(--mw-dark); background: var(--mw-blue); }
    .ghost-button { border-color: #c9c8d3; color: var(--mw-dark); background: #fff; }
    .ghost-button:hover { background: #f2f2f6; }
    .danger-button { color: #7a1015; background: #ffe3e4; }
    .wide { width: 100%; }
    .integration-note { display: grid; gap: 4px; margin-top: 22px; color: var(--muted); font-size: 12px; }
    .integration-note code { width: max-content; max-width: 100%; padding: 4px 7px; background: #efeff4; color: var(--mw-dark); overflow-wrap: anywhere; }

    .app-shell { min-height: calc(100vh - 34px); }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 26px clamp(18px, 4vw, 58px);
      color: #fff;
      background: var(--mw-dark);
    }
    .app-header h1 { margin-bottom: 4px; font-size: clamp(25px, 4vw, 38px); }
    .app-header p { margin: 0; color: rgba(255,255,255,.72); }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .user-chip { display: grid; gap: 2px; min-width: 190px; padding: 10px 13px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); }
    .user-chip span { color: rgba(255,255,255,.68); font-size: 12px; }
    .header-actions .ghost-button { border-color: rgba(255,255,255,.35); color: #fff; background: transparent; }
    .header-actions .ghost-button:hover { background: rgba(255,255,255,.10); }

    .main-nav {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding: 0 clamp(18px, 4vw, 58px);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .nav-button {
      min-height: 50px;
      border: 0;
      border-bottom: 4px solid transparent;
      padding: 10px 16px 7px;
      color: var(--muted);
      background: transparent;
      font-weight: 750;
      white-space: nowrap;
    }
    .nav-button[aria-current="page"] { border-bottom-color: var(--mw-dark); color: var(--mw-dark); }

    .content { padding: 24px clamp(18px, 4vw, 58px) 50px; }
    .view-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .view-heading h2 { margin-bottom: 6px; color: var(--mw-dark); font-size: 26px; }
    .view-heading p { margin: 0; color: var(--muted); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .search-wrap { display: flex; flex: 1 1 300px; gap: 8px; }
    .search-wrap input { flex: 1; }
    .status-message { min-height: 22px; margin: -4px 0 14px; color: var(--muted); font-size: 13px; }

    .chart-viewport {
      min-height: 560px;
      overflow: auto;
      border: 1px solid var(--line);
      background:
        linear-gradient(rgba(7,0,66,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(7,0,66,.025) 1px, transparent 1px),
        #fff;
      background-size: 24px 24px;
      padding: 28px;
    }
    .chart-tree { min-width: 1180px; display: grid; justify-items: center; gap: 28px; }
    .tree-level { position: relative; display: flex; justify-content: center; gap: 22px; width: 100%; }
    .tree-level::before { content: ""; position: absolute; top: -28px; left: 50%; width: 2px; height: 28px; background: #b8b7c8; }
    .tree-level:first-child::before { display: none; }
    .tree-branches { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 24px; width: 100%; position: relative; }
    .tree-branches::before { content: ""; position: absolute; top: -14px; left: 12.5%; right: 12.5%; height: 2px; background: #b8b7c8; }
    .branch { position: relative; display: grid; align-content: start; justify-items: center; gap: 18px; }
    .branch::before { content: ""; position: absolute; top: -14px; left: 50%; width: 2px; height: 14px; background: #b8b7c8; }
    .team-stack { display: grid; gap: 14px; justify-items: center; }
    .person-stack { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px; width: 100%; }

    .org-node {
      position: relative;
      width: 100%;
      max-width: 286px;
      min-height: 132px;
      border: var(--node-border-width, 1px) solid var(--node-border, #cbc9d6);
      background: var(--node-background, #fff);
      color: var(--node-text, var(--ink));
      box-shadow: 0 6px 18px rgba(7,0,66,.08);
      overflow: hidden;
      text-align: left;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .org-node[data-type="person"] { min-height: 178px; }
    button.org-node { padding: 0; }
    button.org-node:hover { transform: translateY(-2px); box-shadow: 0 11px 24px rgba(7,0,66,.14); }
    .org-node.highlighted { box-shadow: 0 0 0 4px rgba(77,69,214,.32), 0 12px 28px rgba(7,0,66,.16); }
    .org-node.dimmed { opacity: .25; }
    .node-accent { height: 9px; background: var(--node-accent, var(--mw-dark)); }
    .node-body { display: grid; align-content: start; gap: 6px; padding: 16px; }
    .node-type { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .node-name { color: var(--mw-dark); font-size: 18px; line-height: 1.2; }
    .node-role { color: var(--ink); font-size: 14px; line-height: 1.35; }
    .node-contact { color: var(--muted); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
    .badge-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .function-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid rgba(7,0,66,.14); background: #f2f1f7; color: var(--mw-dark); font-size: 11px; font-weight: 700; }
    .edit-mode .org-node { cursor: grab; }
    .edit-mode .org-node::after { content: "Verschiebemodus"; position: absolute; right: 7px; bottom: 6px; padding: 3px 5px; color: #fff; background: rgba(7,0,66,.76); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }

    .panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 16px; }
    .panel-card { border: 1px solid var(--line); background: #fff; padding: 20px; box-shadow: 0 5px 16px rgba(7,0,66,.05); }
    .panel-card h3 { margin-bottom: 8px; color: var(--mw-dark); }
    .panel-card p { color: var(--muted); line-height: 1.5; }
    .metric { display: flex; align-items: baseline; gap: 8px; margin: 12px 0; }
    .metric strong { color: var(--mw-dark); font-size: 34px; }
    .metric span { color: var(--muted); }
    .permission-list { display: grid; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
    .permission-list li { padding: 9px 10px; background: #f4f4f7; font-size: 13px; }
    .profile-layout { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px; }
    .profile-card, .profile-form { border: 1px solid var(--line); background: #fff; padding: 22px; }
    .profile-avatar { display: grid; place-items: center; width: 92px; height: 92px; margin-bottom: 18px; color: #fff; background: var(--mw-dark); font-size: 30px; font-weight: 800; }
    .profile-card h3 { margin-bottom: 4px; }
    .profile-card p { color: var(--muted); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

    .drawer-layer { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-columns: 1fr minmax(320px, 520px); background: rgba(7,0,66,.48); }
    .drawer-backdrop { min-width: 0; }
    .drawer { height: 100%; overflow: auto; background: #fff; box-shadow: -20px 0 50px rgba(7,0,66,.24); }
    .drawer-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 24px; color: #fff; background: var(--mw-dark); }
    .drawer-header h2 { margin: 0; }
    .drawer-close { width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.38); color: #fff; background: transparent; font-size: 24px; }
    .drawer-content { padding: 24px; }
    .profile-hero { display: flex; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .profile-hero .profile-avatar { flex: 0 0 auto; margin: 0; width: 76px; height: 76px; }
    .profile-hero p { margin: 4px 0 0; color: var(--muted); }
    .profile-section { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .profile-section h3 { margin-bottom: 12px; color: var(--mw-dark); font-size: 16px; }
    .detail-grid { display: grid; grid-template-columns: 130px 1fr; gap: 9px 14px; margin: 0; }
    .detail-grid dt { color: var(--muted); font-size: 13px; }
    .detail-grid dd { margin: 0; overflow-wrap: anywhere; }

    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 120; max-width: 360px; padding: 13px 16px; color: #fff; background: var(--mw-dark); box-shadow: var(--shadow); }

    @media (max-width: 820px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; justify-content: flex-start; }
      .profile-layout { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .drawer-layer { grid-template-columns: 1fr; }
      .drawer-backdrop { display: none; }
      .drawer { width: 100%; }
    }
    @media (max-width: 560px) {
      .login-content { padding: 26px 20px; }
      .content { padding-inline: 12px; }
      .chart-viewport { padding: 16px; }
      .toolbar > button { flex: 1 1 auto; }
      .search-wrap { flex-direction: column; }
      .user-chip { width: 100%; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-grid dd { margin-bottom: 7px; }
    }
  </style>
</head>
<body>
  <div class="demo-strip"><strong>LIVE-DEMO</strong><span>Nur anonymisierte Beispieldaten · keine Verbindung zum Produktivsystem</span></div>
  <div id="app"></div>
  <div id="drawer-root"></div>
  <div id="toast-root"></div>

  <script>
    const SESSION_KEY = 'mw-orgchart-demo-session';
    const PROFILE_KEY = 'mw-orgchart-demo-profile';

    const users = [
      { id: 'superadmin', displayName: 'Demo Superadmin', email: 'superadmin@example.invalid', role: 'SUPERADMIN', label: 'Superadmin', area: 'Alle Bereiche' },
      { id: 'admin', displayName: 'Demo Administration', email: 'admin@example.invalid', role: 'ADMIN', label: 'Administration', area: 'Alle Bereiche' },
      { id: 'editor', displayName: 'Demo Redaktion', email: 'redaktion@example.invalid', role: 'EDITOR', label: 'Redaktion', area: 'Personalmanagement' },
      { id: 'viewer', displayName: 'Demo Betrachter', email: 'betrachter@example.invalid', role: 'VIEWER', label: 'Betrachter', area: 'Personalmanagement' }
    ];

    const nodes = [
      { id:'mw', type:'company', name:'Münchner Wohnen', subtitle:'Organisationsübersicht', accent:'#070042', bg:'#ffffff' },
      { id:'prv', type:'section', name:'Personal, Recht und Verwaltung', subtitle:'Sektion', accent:'#070042', bg:'#ffffff' },
      { id:'pm', type:'department', name:'Personalmanagement', subtitle:'Abteilung', accent:'#99e7ff', bg:'#ffffff' },
      { id:'pa', type:'department', name:'Personaladministration', subtitle:'Abteilung', accent:'#fda8ff', bg:'#ffffff' },
      { id:'pe', type:'department', name:'Personalentwicklung', subtitle:'Abteilung', accent:'#a8ffab', bg:'#ffffff' },
      { id:'pc', type:'department', name:'Personalcontrolling', subtitle:'Abteilung', accent:'#ff757b', bg:'#ffffff' },
      { id:'pm-hrbp', type:'team', name:'HR Business Partner', subtitle:'Team', accent:'#99e7ff', bg:'#ffffff' },
      { id:'pm-sb', type:'team', name:'Sachbearbeitung', subtitle:'Team', accent:'#99e7ff', bg:'#ffffff' },
      { id:'bgsm', type:'team', name:'Betriebliches Gesundheits- und Sozialmanagement', subtitle:'BGSM', accent:'#a8ffab', bg:'#ffffff' },
      { id:'p1', type:'person', name:'Beispielperson', subtitle:'Beschäftigte Person', role:'HR Business Partner', email:'vorname.nachname@example.invalid', phone:'089 000000', accent:'#ff757b', bg:'#ffffff', functions:['Projektkoordination'], parent:'pm-hrbp' },
      { id:'p2', type:'person', name:'Beispiel Assistenz', subtitle:'Beschäftigte Person', role:'Assistenz der Abteilungsleitung', email:'assistenz@example.invalid', phone:'089 000001', accent:'#fda8ff', bg:'#ffffff', functions:['Assistenz'], parent:'pm' },
      { id:'p3', type:'person', name:'Beispiel Sachbearbeitung', subtitle:'Beschäftigte Person', role:'Sachbearbeitung Personalmanagement', email:'sachbearbeitung@example.invalid', phone:'089 000002', accent:'#99e7ff', bg:'#ffffff', functions:['Fahrradleasing'], parent:'pm-sb' },
      { id:'p4', type:'person', name:'Beispiel BGSM', subtitle:'Beschäftigte Person', role:'Betriebliches Gesundheitsmanagement', email:'bgsm@example.invalid', phone:'089 000003', accent:'#a8ffab', bg:'#ffffff', functions:['Wellpass','Arbeitsschutz'], parent:'bgsm' }
    ];

    const app = document.getElementById('app');
    const drawerRoot = document.getElementById('drawer-root');
    const toastRoot = document.getElementById('toast-root');
    let currentUser = users.find(user => user.id === localStorage.getItem(SESSION_KEY)) || null;
    let currentView = 'chart';
    let editMode = false;
    let selectedLogin = users[0].id;

    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const initials = name => name.split(/\s+/).filter(Boolean).slice(0,2).map(part => part[0]).join('').toUpperCase();
    const canAdmin = user => ['SUPERADMIN','ADMIN','EDITOR'].includes(user.role);
    const canEdit = user => ['SUPERADMIN','ADMIN','EDITOR'].includes(user.role);

    function toast(message) {
      toastRoot.innerHTML = `<div class="toast" role="status">${escapeHtml(message)}</div>`;
      window.setTimeout(() => { toastRoot.innerHTML = ''; }, 2600);
    }

    function renderLogin() {
      const selected = users.find(user => user.id === selectedLogin) || users[0];
      app.innerHTML = `
        <main class="login-page">
          <section class="login-card" aria-labelledby="login-title">
            <div class="login-accent"><span></span><span></span><span></span><span></span></div>
            <div class="login-content">
              <div class="login-brand">
                <span class="eyebrow">Münchner Wohnen</span>
                <h1 id="login-title">MW OrgChart</h1>
                <p>Interaktive, anonymisierte Vorschau mit lokaler Rollen- und Rechteverwaltung.</p>
              </div>
              <label class="form-field">
                <span>Demo-Rolle auswählen</span>
                <select id="role-select">${users.map(user => `<option value="${user.id}" ${user.id === selected.id ? 'selected' : ''}>${escapeHtml(user.label)} – ${escapeHtml(user.displayName)}</option>`).join('')}</select>
              </label>
              <div class="login-summary" id="login-summary">
                <strong>${escapeHtml(selected.label)}</strong>
                <span>${escapeHtml(selected.email)}</span>
                <span>Bereich: ${escapeHtml(selected.area)}</span>
              </div>
              <button class="primary-button wide" id="login-button" type="button">Lokal anmelden</button>
              <div class="integration-note">
                <strong>Demo ohne Backend</strong>
                <span>Die Vorschau speichert Einstellungen ausschließlich in diesem Browser.</span>
                <code>PUBLIC_DEMO=true</code>
              </div>
            </div>
          </section>
        </main>`;

      document.getElementById('role-select').addEventListener('change', event => {
        selectedLogin = event.target.value;
        renderLogin();
      });
      document.getElementById('login-button').addEventListener('click', () => {
        currentUser = users.find(user => user.id === selectedLogin) || users[0];
        localStorage.setItem(SESSION_KEY, currentUser.id);
        currentView = 'chart';
        renderApp();
      });
    }

    function nodeHtml(node, interactive = false) {
      const classes = ['org-node'];
      const functions = node.functions?.length ? `<div class="badge-list" role="list" aria-label="Zusatzfunktionen">${node.functions.map(name => `<span class="function-badge" role="listitem"><span aria-hidden="true">◆</span>${escapeHtml(name)}</span>`).join('')}</div>` : '';
      const contact = [node.email,node.phone].filter(Boolean).map(escapeHtml).join(' · ');
      const body = `<div class="node-accent"></div><div class="node-body"><span class="node-type">${escapeHtml(node.subtitle || node.type)}</span><strong class="node-name">${escapeHtml(node.name)}</strong>${node.role ? `<span class="node-role">${escapeHtml(node.role)}</span>` : ''}${functions}${contact ? `<span class="node-contact">${contact}</span>` : ''}</div>`;
      const style = `--node-accent:${node.accent};--node-background:${node.bg};--node-border:#cfced9;--node-border-width:1px`;
      return interactive ? `<button type="button" class="${classes.join(' ')}" data-node-id="${node.id}" data-type="${node.type}" style="${style}" aria-label="Profil von ${escapeHtml(node.name)} öffnen">${body}</button>` : `<article class="${classes.join(' ')}" data-node-id="${node.id}" data-type="${node.type}" style="${style}">${body}</article>`;
    }

    function chartHtml() {
      const byId = id => nodes.find(node => node.id === id);
      const people = parent => nodes.filter(node => node.type === 'person' && node.parent === parent);
      const branch = (departmentId, teamIds = []) => {
        const department = byId(departmentId);
        return `<div class="branch">${nodeHtml(department)}<div class="team-stack">${teamIds.map(teamId => `${nodeHtml(byId(teamId))}<div class="person-stack">${people(teamId).map(person => nodeHtml(person,true)).join('')}</div>`).join('')}${people(departmentId).length ? `<div class="person-stack">${people(departmentId).map(person => nodeHtml(person,true)).join('')}</div>` : ''}</div></div>`;
      };
      return `<div class="chart-tree ${editMode ? 'edit-mode' : ''}">
        <div class="tree-level">${nodeHtml(byId('mw'))}</div>
        <div class="tree-level">${nodeHtml(byId('prv'))}</div>
        <div class="tree-branches">
          ${branch('pm',['pm-hrbp','pm-sb'])}
          ${branch('pa',[])}
          ${branch('pe',[])}
          ${branch('pc',['bgsm'])}
        </div>
      </div>`;
    }

    function renderChartView() {
      return `<section aria-labelledby="chart-title">
        <div class="view-heading"><div><h2 id="chart-title">Organigramm</h2><p>Interaktive Vorschau der Organisationsstruktur mit anonymisierten Beispieldaten.</p></div></div>
        <div class="toolbar">
          <div class="search-wrap"><input id="search-input" type="search" placeholder="Person, Rolle, Einheit oder Funktion suchen" aria-label="Organigramm durchsuchen"><button class="secondary-button" id="search-button" type="button">Suchen</button></div>
          ${canEdit(currentUser) ? `<button class="ghost-button" id="edit-button" type="button">${editMode ? 'Verschiebemodus beenden' : 'Struktur verschieben'}</button>` : ''}
          <button class="ghost-button" id="fit-button" type="button">Ansicht zurücksetzen</button>
        </div>
        <div class="status-message" id="status-message">${editMode ? 'Demo-Verschiebemodus aktiv. In dieser öffentlichen Vorschau werden keine Strukturänderungen übertragen.' : 'Personenkarte anklicken, um das Profil zu öffnen.'}</div>
        <div class="chart-viewport" id="chart-viewport">${chartHtml()}</div>
      </section>`;
    }

    function renderProfileView() {
      const stored = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}');
      const name = stored.displayName || currentUser.displayName;
      const email = currentUser.email;
      return `<section aria-labelledby="profile-title">
        <div class="view-heading"><div><h2 id="profile-title">Mein Profil</h2><p>Lokale Demonstration der persönlichen Profildaten.</p></div></div>
        <div class="profile-layout">
          <article class="profile-card"><div class="profile-avatar">${escapeHtml(initials(name))}</div><h3>${escapeHtml(name)}</h3><p>${escapeHtml(currentUser.label)}</p><ul class="permission-list"><li>${escapeHtml(email)}</li><li>Bereich: ${escapeHtml(currentUser.area)}</li><li>Speicherung: nur lokal im Browser</li></ul></article>
          <form class="profile-form" id="profile-form"><h3>Profildaten bearbeiten</h3><p>Die Eingaben werden nicht an einen Server gesendet.</p><div class="form-grid"><label class="form-field"><span>Anzeigename</span><input name="displayName" value="${escapeHtml(name)}"></label><label class="form-field"><span>Mobiltelefon</span><input name="mobilePhone" value="${escapeHtml(stored.mobilePhone || '')}" placeholder="Optional"></label><label class="form-field"><span>Standort</span><input name="locationName" value="${escapeHtml(stored.locationName || 'München')}" placeholder="Standort"></label><label class="form-field"><span>E-Mail</span><input value="${escapeHtml(email)}" disabled></label></div><div class="form-actions"><button class="primary-button" type="submit">Lokal speichern</button><button class="ghost-button" id="profile-reset" type="button">Profildaten zurücksetzen</button></div></form>
        </div>
      </section>`;
    }

    function renderAdminView() {
      const rolePermissions = {
        SUPERADMIN:['Benutzer verwalten','Organigramm vollständig bearbeiten','Rollen und Rechte verwalten','Datenqualität prüfen'],
        ADMIN:['Benutzer verwalten','Organigramm bearbeiten','Standorte verwalten','Zusatzfunktionen verwalten'],
        EDITOR:['Organigramm im eigenen Bereich bearbeiten','Datenqualität prüfen'],
        VIEWER:['Organigramm ansehen']
      };
      return `<section aria-labelledby="admin-title"><div class="view-heading"><div><h2 id="admin-title">Admin Center</h2><p>Vorschau der rollenbasierten Verwaltungsbereiche.</p></div></div><div class="panel-grid">
        <article class="panel-card"><span class="eyebrow">Datenbestand</span><h3>Organisation</h3><div class="metric"><strong>${nodes.filter(node=>node.type!=='person').length}</strong><span>Einheiten</span></div><p>Unternehmen, Sektion, Abteilungen und Teams der Demo-Struktur.</p></article>
        <article class="panel-card"><span class="eyebrow">Personen</span><h3>Beschäftigte</h3><div class="metric"><strong>${nodes.filter(node=>node.type==='person').length}</strong><span>Beispielprofile</span></div><p>Alle Namen und Kontaktdaten sind frei erfunden.</p></article>
        <article class="panel-card"><span class="eyebrow">Aktive Rolle</span><h3>${escapeHtml(currentUser.label)}</h3><ul class="permission-list">${rolePermissions[currentUser.role].map(permission=>`<li>${escapeHtml(permission)}</li>`).join('')}</ul></article>
        <article class="panel-card"><span class="eyebrow">Datenqualität</span><h3>Prüfergebnis</h3><div class="metric"><strong>0</strong><span>kritische Fehler</span></div><p>Die anonymisierten Ausgangsdaten sind konsistent und vollständig darstellbar.</p><button class="secondary-button" id="quality-button" type="button">Prüfung erneut ausführen</button></article>
      </div></section>`;
    }

    function renderApp() {
      if (!currentUser) return renderLogin();
      const viewContent = currentView === 'profile' ? renderProfileView() : currentView === 'admin' ? renderAdminView() : renderChartView();
      app.innerHTML = `<main class="app-shell"><header class="app-header"><div><span class="eyebrow" style="color:#99e7ff">Münchner Wohnen</span><h1>MW OrgChart</h1><p>Interaktives Organigramm mit lokaler Rollen- und Rechteverwaltung.</p></div><div class="header-actions"><div class="user-chip"><strong>${escapeHtml(currentUser.displayName)}</strong><span>${escapeHtml(currentUser.label)} · ${escapeHtml(currentUser.area)}</span></div><button class="ghost-button" id="logout-button" type="button">Abmelden</button></div></header><nav class="main-nav" aria-label="Hauptnavigation"><button class="nav-button" data-view="chart" ${currentView==='chart'?'aria-current="page"':''}>Organigramm</button><button class="nav-button" data-view="profile" ${currentView==='profile'?'aria-current="page"':''}>Mein Profil</button>${canAdmin(currentUser)?`<button class="nav-button" data-view="admin" ${currentView==='admin'?'aria-current="page"':''}>Admin Center</button>`:''}</nav><div class="content">${viewContent}</div></main>`;
      bindAppEvents();
    }

    function bindAppEvents() {
      document.getElementById('logout-button').addEventListener('click', () => { localStorage.removeItem(SESSION_KEY); currentUser=null; drawerRoot.innerHTML=''; renderLogin(); });
      document.querySelectorAll('.nav-button').forEach(button => button.addEventListener('click', () => { currentView=button.dataset.view; drawerRoot.innerHTML=''; renderApp(); }));
      if (currentView === 'chart') bindChartEvents();
      if (currentView === 'profile') bindProfileEvents();
      if (currentView === 'admin') document.getElementById('quality-button')?.addEventListener('click', () => toast('Datenprüfung abgeschlossen: keine kritischen Fehler.'));
    }

    function bindChartEvents() {
      document.querySelectorAll('button.org-node[data-type="person"]').forEach(card => card.addEventListener('click', () => { if (!editMode) openDrawer(card.dataset.nodeId); }));
      const search = () => {
        const query = document.getElementById('search-input').value.trim().toLocaleLowerCase('de-DE');
        const cards = [...document.querySelectorAll('.org-node')];
        cards.forEach(card => card.classList.remove('highlighted','dimmed'));
        if (!query) { document.getElementById('status-message').textContent='Suche zurückgesetzt.'; return; }
        let matches=0;
        cards.forEach(card => { const match = card.textContent.toLocaleLowerCase('de-DE').includes(query); card.classList.toggle('highlighted',match); card.classList.toggle('dimmed',!match); if(match) matches++; });
        document.getElementById('status-message').textContent = matches ? `${matches} Treffer hervorgehoben.` : 'Kein Treffer gefunden.';
        document.querySelector('.highlighted')?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
      };
      document.getElementById('search-button').addEventListener('click', search);
      document.getElementById('search-input').addEventListener('keydown', event => { if(event.key==='Enter') search(); });
      document.getElementById('fit-button').addEventListener('click', () => { document.getElementById('chart-viewport').scrollTo({top:0,left:0,behavior:'smooth'}); document.querySelectorAll('.org-node').forEach(card=>card.classList.remove('highlighted','dimmed')); document.getElementById('search-input').value=''; document.getElementById('status-message').textContent='Ansicht und Suche wurden zurückgesetzt.'; });
      document.getElementById('edit-button')?.addEventListener('click', () => { editMode=!editMode; renderApp(); });
    }

    function bindProfileEvents() {
      document.getElementById('profile-form').addEventListener('submit', event => { event.preventDefault(); const data=Object.fromEntries(new FormData(event.currentTarget)); localStorage.setItem(PROFILE_KEY,JSON.stringify(data)); toast('Profildaten wurden lokal gespeichert.'); renderApp(); });
      document.getElementById('profile-reset').addEventListener('click', () => { localStorage.removeItem(PROFILE_KEY); toast('Lokale Profildaten wurden zurückgesetzt.'); renderApp(); });
    }

    function openDrawer(id) {
      const person = nodes.find(node => node.id===id && node.type==='person');
      if(!person) return;
      const parent = nodes.find(node => node.id===person.parent);
      drawerRoot.innerHTML = `<div class="drawer-layer"><button class="drawer-backdrop" type="button" aria-label="Profil schließen"></button><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-header"><div><span class="eyebrow" style="color:#99e7ff">Personenprofil</span><h2 id="drawer-title">${escapeHtml(person.name)}</h2></div><button class="drawer-close" type="button" aria-label="Profil schließen">×</button></header><div class="drawer-content"><div class="profile-hero"><div class="profile-avatar">${escapeHtml(initials(person.name))}</div><div><h3>${escapeHtml(person.name)}</h3><p>${escapeHtml(person.role)}</p></div></div><section class="profile-section"><h3>Kontaktdaten</h3><dl class="detail-grid"><dt>E-Mail</dt><dd>${escapeHtml(person.email)}</dd><dt>Telefon</dt><dd>${escapeHtml(person.phone)}</dd><dt>Status</dt><dd>Aktiv · Demo-Datensatz</dd></dl></section><section class="profile-section"><h3>Organisation</h3><dl class="detail-grid"><dt>Zuordnung</dt><dd>${escapeHtml(parent?.name || '—')}</dd><dt>Pfad</dt><dd>Münchner Wohnen → Personal, Recht und Verwaltung → ${escapeHtml(parent?.name || '')}</dd></dl></section><section class="profile-section"><h3>Zusatzfunktionen</h3><div class="badge-list">${(person.functions||[]).map(name=>`<span class="function-badge">◆ ${escapeHtml(name)}</span>`).join('') || '<span>Keine Zusatzfunktion</span>'}</div></section><section class="profile-section"><h3>Hinweis</h3><p>Dieses Profil enthält ausschließlich frei erfundene Daten für die öffentliche Live-Demo.</p></section></div></aside></div>`;
      const close = () => { drawerRoot.innerHTML=''; };
      drawerRoot.querySelector('.drawer-close').addEventListener('click',close);
      drawerRoot.querySelector('.drawer-backdrop').addEventListener('click',close);
      drawerRoot.querySelector('.drawer-close').focus();
      const escapeHandler = event => { if(event.key==='Escape'){ close(); document.removeEventListener('keydown',escapeHandler); } };
      document.addEventListener('keydown',escapeHandler);
    }

    currentUser ? renderApp() : renderLogin();
  </script>
</body>
</html>
