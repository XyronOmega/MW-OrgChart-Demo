name: Demo static quality

# Prüft den Quellstand in diesem Branch. Zuvor wurde der bereits
# veröffentlichte gh-pages-Branch geprüft; seit die Quellen in main liegen,
# wird hier der Stand geprüft, der anschließend veröffentlicht wird.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-demo-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: npm run check

      # Prettier wird vor den Tests bereitgestellt: Die Pruefung zur
      # Reproduzierbarkeit der Formatierung laeuft auch als Teil von `npm test`
      # und wuerde sich ohne das Paket stillschweigend ueberspringen.
      #
      # Achtung bei der Reihenfolge: Das Projekt fuehrt keine Abhaengigkeiten,
      # deshalb entfernt jedes weitere `npm install --no-save` das zuvor
      # installierte Paket wieder. Jeder Schritt installiert daher selbst, was
      # er braucht, unmittelbar davor.
      - name: Install Prettier
        run: npm install --no-save prettier@3

      # Uebersprungene Tests sind keine bestandenen Tests.
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit.log
          if grep -qE 'skipped [1-9][0-9]*$' unit.log; then
            echo "Einheitentests wurden uebersprungen – benoetigte Werkzeuge fehlen."
            exit 1
          fi
          rm -f unit.log

      # `npx playwright install` lädt nur die Browser herunter. Ohne das Paket
      # selbst im Arbeitsverzeichnis scheitert `import('playwright')` in den
      # Testdateien, und die Browsertests überspringen sich stillschweigend.
      # `--no-save` hält das Projekt weiterhin abhängigkeitsfrei.
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      # Übersprungene Tests sind keine bestandenen Tests: Der Lauf muss die
      # Browsertests tatsächlich ausgeführt haben.
      - name: Run browser and stability tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
          # Je nach Reporter lautet die Zeile "# skipped N" oder "ℹ skipped N".
          if grep -qE 'skipped [1-9][0-9]*$' e2e.log; then
            echo "Browsertests wurden übersprungen – Playwright war nicht verfügbar."
            exit 1
          fi
          rm -f e2e.log

      - name: Verify assets are loaded
        run: |
          grep -F 'platform-admin.css?v=1' index.html
          grep -F 'platform-admin.js?v=3' index.html
          grep -F 'changeset-demo.css?v=1' index.html
          grep -F 'changeset-demo.js?v=2' index.html
          grep -F 'orgchart-navigation.css?v=1' index.html
          grep -F 'orgchart-navigation-bootstrap.js?v=2' index.html
          grep -F 'orgchart-navigation.js?v=2' index.html
          grep -F 'navigation-shell.css?v=1' index.html
          grep -F 'navigation-shell.js?v=2' index.html
          grep -F 'ui-lifecycle.js?v=1' index.html
          grep -F 'app.js?v=masks-1' index.html
          grep -F 'leadership-overlay.css?v=4' index.html
          grep -F 'leadership-overlay.js?v=5' index.html
          grep -F 'roles.js?v=1' index.html
          grep -F 'accessibility.css?v=1' index.html
          grep -F 'accessibility.js?v=1' index.html
          grep -F 'edit-mask.css?v=3' index.html
          grep -F 'edit-mask.js?v=3' index.html
          grep -F 'person-groups.css?v=4' index.html
          grep -F 'person-groups.js?v=5' index.html

      # app.js wird als lesbarer Quelltext gefuehrt. Der Test faellt aus, sobald
      # Laufzeitdekodierung, eine zweite globale Schnittstelle oder eine
      # fehlende Kernfunktion zurueckkehrt.
      #
      # Prettier wird eigens bereitgestellt: Ohne das Paket ueberspringt sich
      # der Test zur Reproduzierbarkeit der Formatierung stillschweigend.
      # Uebersprungene Tests sind keine bestandenen Tests.
      - name: Verify readable application core
        run: |
          set -o pipefail
          npm install --no-save prettier@3
          node --test test/app-source.test.js 2>&1 | tee app-source.log
          if grep -qE 'skipped [1-9][0-9]*$' app-source.log; then
            echo "Tests wurden uebersprungen – benoetigte Werkzeuge fehlen."
            exit 1
          fi
          rm -f app-source.log

      - name: Verify demo makes no backend calls
        run: |
          if grep -rnE "fetch\(|XMLHttpRequest|/api/" --include='*.js' --include='*.html' \
             --exclude-dir=node_modules --exclude-dir=.git . \
             | grep -v '^./test/'; then
            echo "Die Demo darf keine Backend-Aufrufe enthalten."
            exit 1
          fi
          echo "Keine Backend-Aufrufe gefunden."
